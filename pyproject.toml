[project]
name = "project"
version = "0.1.0"
description = "ML research project (from research-init template)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# 按需启用：uv sync --extra torch --extra track
torch = ["torch>=2.3"]
track = ["wandb>=0.17"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "ipykernel>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
